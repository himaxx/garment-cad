[workspace]
resolver = "2"
members = ["crates/geom", "crates/model", "crates/io", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gcad-geom = { path = "crates/geom" }
gcad-model = { path = "crates/model" }
gcad-io = { path = "crates/io" }
